name: Publish NuGet packages

on:
  push:
    branches:
      - main

jobs:
  publish:
    if: contains(join(github.event.commits.*.message, ' '), '[NUGET_PUBLISH]')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore projects
        run: |
          set -euo pipefail

          projects=(
            "Base.Contracts.Domain/Base.Contracts.Domain.csproj"
            "Base.Contracts.DTO/Base.Contracts.DTO.csproj"
            "Base.Contracts.DataAccess/Base.Contracts.DataAccess.csproj"
            "Base.Contracts.Application/Base.Contracts.Application.csproj"
            "Base.Contracts.Keycloak/Base.Contracts.Keycloak.csproj"
            "Base.Domain/Base.Domain.csproj"
            "Base.DTO/Base.DTO.csproj"
            "Base.DataAccess.EF/Base.DataAccess.EF.csproj"
            "Base.Application/Base.Application.csproj"
            "Base.Contracts.Exception/Base.Contracts.Exception.csproj"
            "Base.Exception/Base.Exception.csproj"
            "Base.Contracts.Message/Base.Contracts.Message.csproj"
            "Base.Domain.Identity/Base.Domain.Identity.csproj"
            "Base.Keycloak/Base.Keycloak.csproj"
            "Base.Message/Base.Message.csproj"
            "Base.Message.RabbitMQ/Base.Message.RabbitMQ.csproj"
          )

          for project in "${projects[@]}"; do
            dotnet restore "$project"
          done

      - name: Pack NuGet packages
        run: |
          set -euo pipefail

          projects=(
            "Base.Contracts.Domain/Base.Contracts.Domain.csproj"
            "Base.Contracts.DTO/Base.Contracts.DTO.csproj"
            "Base.Contracts.DataAccess/Base.Contracts.DataAccess.csproj"
            "Base.Contracts.Application/Base.Contracts.Application.csproj"
            "Base.Contracts.Keycloak/Base.Contracts.Keycloak.csproj"
            "Base.Domain/Base.Domain.csproj"
            "Base.DTO/Base.DTO.csproj"
            "Base.DataAccess.EF/Base.DataAccess.EF.csproj"
            "Base.Application/Base.Application.csproj"
            "Base.Contracts.Exception/Base.Contracts.Exception.csproj"
            "Base.Exception/Base.Exception.csproj"
            "Base.Contracts.Message/Base.Contracts.Message.csproj"
            "Base.Domain.Identity/Base.Domain.Identity.csproj"
            "Base.Keycloak/Base.Keycloak.csproj"
            "Base.Message/Base.Message.csproj"
            "Base.Message.RabbitMQ/Base.Message.RabbitMQ.csproj"
          )

          package_output_dir="$RUNNER_TEMP/nuget-packages"
          mkdir -p "$package_output_dir"

          for project in "${projects[@]}"; do
            dotnet pack "$project" -c Release --no-restore --output "$package_output_dir"
          done

          mapfile -d '' -t packages < <(
            find "$package_output_dir" -maxdepth 1 -type f -name '*.nupkg' -not -name '*.symbols.nupkg' -print0 | sort -z
          )

          if [[ ${#packages[@]} -eq 0 ]]; then
            echo "::error::No NuGet packages were created."
            exit 1
          fi

      - name: Validate NuGet trusted publishing configuration
        env:
          NUGET_USER: ${{ vars.NUGET_USER || secrets.NUGET_USER }}
        run: |
          set -euo pipefail

          if [[ -z "${NUGET_USER:-}" ]]; then
            echo "::error::Set NUGET_USER to your nuget.org profile name as a repository variable or secret."
            exit 1
          fi

      - name: NuGet login
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: ${{ vars.NUGET_USER || secrets.NUGET_USER }}

      - name: Publish NuGet packages
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          set -euo pipefail

          if [[ -z "${NUGET_API_KEY:-}" ]]; then
            echo "::error::NuGet trusted publishing did not return a temporary API key."
            exit 1
          fi

          package_output_dir="$RUNNER_TEMP/nuget-packages"
          mapfile -d '' -t packages < <(
            find "$package_output_dir" -maxdepth 1 -type f -name '*.nupkg' -not -name '*.symbols.nupkg' -print0 | sort -z
          )

          if [[ ${#packages[@]} -eq 0 ]]; then
            echo "::error::No NuGet packages were found to publish."
            exit 1
          fi

          for package in "${packages[@]}"; do
            dotnet nuget push "$package" \
              --source https://api.nuget.org/v3/index.json \
              --api-key "$NUGET_API_KEY" \
              --skip-duplicate
          done
